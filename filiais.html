<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filiais - Cadastro UTFPR</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Cadastro UTFPR</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="clientes.html">Clientes</a>
        <a class="nav-link active" href="filiais.html">Filiais</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h4 mb-4">Filiais</h1>

    <div id="alertaFiliais"></div>

    <div class="card card-custom mb-4">
      <div class="card-header" id="tituloFormFilial">Nova filial</div>
      <div class="card-body">
        <form id="formFilial">
          <input type="hidden" id="filialId">
          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Nome da filial</label>
              <input type="text" class="form-control" id="nomeFilial" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" id="emailFilial" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-control" id="telefoneFilial" placeholder="(00) 00000-0000" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Endereço</label>
              <input type="text" class="form-control" id="logradouroFilial" required>
            </div>
          </div>

          <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-accent">Salvar filial</button>
            <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelarEdicaoFilial">Cancelar edição</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card card-custom">
      <div class="card-header">Filiais cadastradas</div>
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Endereço</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Status</th>
              <th>Clientes</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaFiliais">
            <tr><td colspan="7" class="empty-state">Carregando filiais...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal: gerenciar clientes de uma filial -->
  <div class="modal fade" id="modalClientesFilial" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Clientes da filial <span id="nomeFilialModal"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div id="listaClientesModal">Carregando clientes...</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="button" class="btn btn-accent" id="btnSalvarClientesFilial">Salvar vínculos</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/filiais.js"></script>
</body>

</html>
