<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - Cadastro UTFPR</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Cadastro UTFPR</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link active" href="clientes.html">Clientes</a>
        <a class="nav-link" href="filiais.html">Filiais</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h4 mb-4">Clientes</h1>

    <div id="alertaClientes"></div>

    <div class="card card-custom mb-4">
      <div class="card-header" id="tituloFormCliente">Novo cliente</div>
      <div class="card-body">
        <form id="formCliente">
          <input type="hidden" id="clienteId">

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required>
            </div>

            <div class="col-md-3">
              <label class="form-label">Idade</label>
              <input type="number" class="form-control" id="idade" min="0" required>
            </div>

            <div class="col-md-3">
              <label class="form-label">Sexo</label>
              <select class="form-select" id="sexo" required>
                <option value="" selected disabled>Selecione</option>
                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
                <option value="Outro">Outro</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
            </div>

            <div class="col-12">
              <label class="form-label">Endereço</label>
              <input type="text" class="form-control" id="logradouro" required>
            </div>

            <div class="col-12">
              <label class="form-label">Filiais vinculadas</label>
              <div id="filiaisCheckboxes" class="d-flex flex-wrap gap-3 border rounded p-2">
                <span class="text-muted small">Carregando filiais...</span>
              </div>
            </div>
          </div>

          <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-accent">Salvar cliente</button>
            <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelarEdicao">Cancelar edição</button>
          </div>

        </form>
      </div>
    </div>

    <div class="card card-custom">
      <div class="card-header">Clientes cadastrados</div>
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Filiais</th>
              <th class="text-end">Ações</th>
            </tr>
          </thead>

          <tbody id="tabelaClientes">
            <tr><td colspan="6" class="empty-state">Carregando clientes...</td></tr>
          </tbody>

        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/clientes.js"></script>
</body>

</html>
